name: Copilot Setup Steps
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Agents secrets
        run: |
          set -euo pipefail

          # The Agents secrets are mapped into the step environment by the generated
          # workflow, so the values are read directly from the environment.
          unset GITHUB_TOKEN GH_TOKEN GH_ENTERPRISE_TOKEN GH_HOST GH_REPO

          echo "Copying secrets to org-zumix (github.com)"
          export GH_HOST='github.com'
          export GH_TOKEN="${GH_SECRET_KIT_COPY_TOKEN_GITHUB_COM}"
          unset GH_ENTERPRISE_TOKEN
          export DESTINATION='org-zumix'

          SECRET_VALUE="${TEST-}"
          (
          if [ -z "${SECRET_VALUE}" ]; then
            echo "Secret TEST is empty or does not exist, skipping..."
            exit 0
          fi

          # Check if secret already exists at destination
          if ! _existing_secrets="$(gh secret list --org "${DESTINATION}" --app agents)"; then
            echo "Failed to list destination secrets while checking TEST2" >&2
            exit 1
          fi
          if printf '%s\n' "${_existing_secrets}" | grep -E "^TEST2([[:space:]]|$)" >/dev/null; then
            echo "Secret TEST2 already exists at destination, skipping..."
            exit 0
          fi

          # Set secret TEST2 at destination
          printf '%s\n' "${SECRET_VALUE}" | \
            gh secret set TEST2 --org "${DESTINATION}" --app agents
          echo "Successfully migrated secret: TEST -> TEST2"
          )

          echo 'gh-secret-kit: agents secret copy finished'
        env:
          GH_SECRET_KIT_COPY_TOKEN_GITHUB_COM: ${{ secrets.GH_SECRET_KIT_COPY_TOKEN_GITHUB_COM }}
          TEST: ${{ secrets.TEST }}
