name: gh-secret-kit-dependabot-copy
run-name: gh-secret-kit-dependabot-copy-1790815162024003000
on:
  push:
    branches:
      - dependabot/**
permissions:
  contents: read
jobs:
  copy-dependabot-secrets:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Copy Dependabot secrets
        run: |
          set -euo pipefail

          unset GITHUB_TOKEN GH_TOKEN GH_ENTERPRISE_TOKEN GH_HOST GH_REPO

          echo "Copying secrets to org-zumix (github.com)"
          export GH_HOST='github.com'
          export GH_TOKEN="${GH_SECRET_KIT_COPY_TOKEN_1790815162024003000_GITHUB_COM}"
          unset GH_ENTERPRISE_TOKEN
          export DESTINATION='org-zumix'

          SECRET_VALUE="${TEST-}"
          (
          if [ -z "${SECRET_VALUE}" ]; then
            echo "Secret TEST is empty or does not exist, skipping..."
            exit 0
          fi

          # Check if secret already exists at destination
          if ! _existing_secrets="$(gh secret list --org "${DESTINATION}" --app dependabot)"; then
            echo "Failed to list destination secrets while checking TEST2" >&2
            exit 1
          fi
          if printf '%s\n' "${_existing_secrets}" | grep -E "^TEST2([[:space:]]|$)" >/dev/null; then
            echo "Secret TEST2 already exists at destination, skipping..."
            exit 0
          fi

          # Set secret TEST2 at destination
          printf '%s\n' "${SECRET_VALUE}" | \
            gh secret set TEST2 --org "${DESTINATION}" --app dependabot
          echo "Successfully migrated secret: TEST -> TEST2"
          )

          echo 'gh-secret-kit: dependabot secret copy finished'
        shell: bash
        env:
          GH_SECRET_KIT_COPY_TOKEN_1790815162024003000_GITHUB_COM: ${{ secrets.GH_SECRET_KIT_COPY_TOKEN_1790815162024003000_GITHUB_COM }}
          TEST: ${{ secrets.TEST }}
